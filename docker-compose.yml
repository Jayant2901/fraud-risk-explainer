# Full stack for local/demo use. Requires models/ already populated
# (`python src/train_model.py`) and a .env file at the repo root (copy
# from .env.example) providing API_KEY and GEMINI_API_KEY — compose
# reads .env automatically for the ${VAR} substitutions below.
#
#   docker compose up --build
#
# Backend: http://localhost:8000  Frontend: http://localhost:5173
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      API_KEY: ${API_KEY:?API_KEY must be set in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  # Scores transaction events published by POST /api/events/transaction.
  # Same image as the backend, different command — it must run the exact
  # same scoring code (src/scoring_service.py), not a copy of it. Scale
  # with `docker compose up --scale consumer=3`: they share one consumer
  # group, so work is split rather than duplicated.
  consumer:
    build: .
    command: ["python", "-m", "src.stream_consumer"]
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Build-time only — see frontend/Dockerfile's comment on why this
        # can't be a runtime `environment:` entry instead.
        VITE_API_KEY: ${API_KEY:?API_KEY must be set in .env}
    ports:
      - "5173:80"
    depends_on:
      - backend

  # Optional: `docker compose --profile observability up` (in addition to
  # the default services above). Scrapes GET /metrics on both the
  # backend and the consumer — see ops/prometheus.yml and
  # src/domain_metrics.py — and a pre-provisioned Grafana dashboard
  # (ops/grafana/) with no manual setup needed.
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend
      - consumer

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  redis-data:
