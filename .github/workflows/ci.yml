name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Dockerfile — requirements.txt's pinned
          # numpy==2.5.1 has no Python 3.11 wheel at all (3.12+ only).
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - run: pytest --cov=src --cov=api --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # vite@8 requires Node ^20.19.0 || >=22.12.0 — pinning "20" let
          # setup-node resolve to a pre-20.19 patch, which vitest failed
          # to run under. 22 satisfies the floor unambiguously.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
